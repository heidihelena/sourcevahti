[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sourcevahti"
version = "0.2.0"
description = "Reliable MCP access to public health, government, and research data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "SourceVahti contributors" },
]
keywords = ["mcp", "health-data", "open-data", "epidemiology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "mcp[cli]>=2.0.0,<3.0.0",
  "pydantic>=2.11,<3.0",
]

[project.optional-dependencies]
dev = [
  "anyio>=4.9",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[project.scripts]
sourcevahti = "sourcevahti.server:main"

[project.urls]
Homepage = "https://github.com/heidihelena/sourcevahti"
Issues = "https://github.com/heidihelena/sourcevahti/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcevahti"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/docs",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=sourcevahti --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sourcevahti"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sourcevahti"]
warn_unreachable = true
